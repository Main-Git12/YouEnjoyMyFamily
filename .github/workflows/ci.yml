name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Typecheck and tests never read template.yaml, so a route pointing at
      # a nonexistent ApiId passes them and only fails at deploy. This
      # catches it here. SAM's esbuild builder needs esbuild on PATH.
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: PATH="$PWD/node_modules/.bin:$PATH" sam build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Builds again with a canary key set, and fails if it reaches the
      # output. This is what makes it safe to serve from a public URL.
      - run: npm run verify:bundle

  alexa-skill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa-skill/lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alexa-skill/lambda/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
