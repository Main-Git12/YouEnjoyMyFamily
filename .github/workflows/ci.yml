name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Runs before anything else: a leak is not something a passing test suite
  # will ever tell you about, and this repository has published a child's
  # school once already.
  private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The denylist half only runs if the repo owner supplies their terms
      # as a secret. Without it the structural check still runs.
      - name: Write the private-terms denylist, if one is configured
        if: ${{ secrets.PRIVATE_TERMS != '' }}
        run: printf '%s\n' "$PRIVATE_TERMS" > .private-terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - run: npm run verify:private
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Typecheck and tests never read template.yaml, so a route pointing at
      # a nonexistent ApiId passes them and only fails at deploy. These two
      # catch it here. The first needs no AWS tooling, runs in a second and
      # says which logical id you meant; it also catches a handler whose
      # DynamoDB policy is missing, which `sam build` happily accepts and
      # which then fails at runtime with AccessDenied.
      - run: npm run verify:template
      # And this one compiles every handler the way the deploy will.
      # SAM's esbuild builder needs esbuild on PATH.
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: PATH="$PWD/node_modules/.bin:$PATH" sam build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Builds again with a canary key set, and fails if it reaches the
      # output. This is what makes it safe to serve from a public URL.
      - run: npm run verify:bundle
      # Icons fail silently — an unreadable favicon or a maskable icon the
      # launcher crops looks fine in `dist/` and wrong on a phone. This reads
      # the committed PNGs and checks what a launcher will actually show.
      - run: npm run verify:icons

  alexa-skill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa-skill/lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alexa-skill/lambda/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
