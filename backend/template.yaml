AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  YouEnjoyMyFamily backend — API Gateway + Lambda + single-table DynamoDB + EventBridge
  sync jobs for the family management / Echo Show dashboard.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref YouEnjoyMyFamilyTable
        STAGE: !Ref Stage
    Tracing: Active

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  # ---------------------------------------------------------------------
  # Data layer — single-table DynamoDB design (see backend/models/schema.md)
  # ---------------------------------------------------------------------
  YouEnjoyMyFamilyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub YouEnjoyMyFamily-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------
  # API Gateway (HTTP API) — routes mobile + Echo Show requests
  # ---------------------------------------------------------------------
  YouEnjoyMyFamilyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["Content-Type", "Authorization"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  # The only unauthenticated route — see src/handlers/families.ts and
  # src/lib/auth.ts. Every other function's routes below require
  # `Authorization: Bearer <apiKey>` and are otherwise unchanged.
  FamiliesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/families.ts]
    Properties:
      Handler: src/handlers/families.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families
            Method: POST

  TasksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/tasks.ts]
    Properties:
      Handler: src/handlers/tasks.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/tasks
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/tasks
            Method: POST
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/tasks/{taskId}
            Method: PUT
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/tasks/{taskId}
            Method: DELETE
        ListTaskCompletions:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/task-completions
            Method: GET

  SchedulesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/schedules.ts]
    Properties:
      Handler: src/handlers/schedules.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/schedules
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/schedules
            Method: POST
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/schedules/{scheduleId}
            Method: PUT
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/schedules/{scheduleId}
            Method: DELETE

  PreferencesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/preferences.ts]
    Properties:
      Handler: src/handlers/preferences.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/members/{memberId}/preferences
            Method: GET
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/members/{memberId}/preferences
            Method: PUT

  StatedPreferencesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/statedPreferences.ts]
    Properties:
      Handler: src/handlers/statedPreferences.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/stated-preferences
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/stated-preferences
            Method: POST
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/stated-preferences/{preferenceId}
            Method: DELETE

  GroceryCartFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/groceryCart.ts]
    Properties:
      Handler: src/handlers/groceryCart.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Environment:
        Variables:
          INSTACART_API_KEY: "{{resolve:ssm-secure:/youenjoymyfamily/instacart/api-key}}"
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/grocery-cart
            Method: GET
        AddItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/grocery-cart/items
            Method: POST
        UpdateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/grocery-cart/items/{itemId}
            Method: PUT
        DeleteItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/grocery-cart/items/{itemId}
            Method: DELETE
        Checkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/grocery-cart/checkout
            Method: POST

  MealPlansFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/mealPlans.ts]
    Properties:
      Handler: src/handlers/mealPlans.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/meal-plan
            Method: GET
        Upsert:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/meal-plan/{date}/{slot}
            Method: PUT
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/meal-plan/{date}/{slot}
            Method: DELETE
        GenerateGroceryList:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/meal-plan/generate-grocery-list
            Method: POST

  # ---------------------------------------------------------------------
  # Background sync — EventBridge scheduled trigger, decoupled from API
  # ---------------------------------------------------------------------
  CalendarSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/calendarSync.ts]
    Properties:
      Handler: src/handlers/calendarSync.handler
      CodeUri: .
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: "{{resolve:ssm:/youenjoymyfamily/google/client-id}}"
          GOOGLE_CLIENT_SECRET: "{{resolve:ssm-secure:/youenjoymyfamily/google/client-secret}}"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Name: !Sub YouEnjoyMyFamily-CalendarSync-${Stage}
            Description: Periodic Google Calendar sync for all connected families
            Enabled: true

  MealPlanGrocerySyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/mealPlanGrocerySync.ts]
    Properties:
      Handler: src/handlers/mealPlanGrocerySync.handler
      CodeUri: .
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 ? * SUN *)
            Name: !Sub YouEnjoyMyFamily-MealPlanGrocerySync-${Stage}
            Description: Weekly conversion of each family's planned meals into grocery cart items
            Enabled: true

  RewardGoalsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node20"
        Sourcemap: true
        EntryPoints: [src/handlers/rewardGoals.ts]
    Properties:
      Handler: src/handlers/rewardGoals.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YouEnjoyMyFamilyTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/reward-goals
            Method: GET
        Upsert:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/reward-goals/{memberId}
            Method: PUT
        ClaimRewardGoal:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/reward-goals/{memberId}/claim
            Method: POST
        ListGemBalances:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/gem-balances
            Method: GET
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YouEnjoyMyFamilyHttpApi
            Path: /families/{familyId}/reward-goals/{memberId}
            Method: DELETE

  # ---------------------------------------------------------------------
  # Frontend hosting — the dashboard has to be reachable from the family's
  # phones, not just the Echo Show on the wall. Private S3 bucket behind
  # CloudFront (HTTPS is also what makes add-to-home-screen work).
  # ---------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub youenjoymyfamily-frontend-${Stage}-${AWS::AccountId}
      # Never public: CloudFront reads it via the origin access control below.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub youenjoymyfamily-frontend-${Stage}
        Description: Lets only this CloudFront distribution read the frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub YouEnjoyMyFamily dashboard (${Stage})
        DefaultRootObject: index.html
        # http2and3: HTTP/3 survives a phone switching between wifi and
        # cellular mid-request, which this app does a lot of.
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized. Deploys still show up promptly because
          # index.html is uploaded with `Cache-Control: no-cache` (see
          # frontend/README.md) while the hashed assets cache for a year.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # It's a single-page app: any path the family bookmarks has to come
        # back as index.html rather than S3's raw NoSuchKey error.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: Base URL for the YouEnjoyMyFamily HTTP API
    Value: !Sub https://${YouEnjoyMyFamilyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TableName:
    Description: DynamoDB single-table name
    Value: !Ref YouEnjoyMyFamilyTable
  FrontendUrl:
    Description: Open this on a phone or Echo Show — the dashboard itself
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: Upload `frontend/dist` here (see frontend/README.md)
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: Pass to `aws cloudfront create-invalidation` after each upload
    Value: !Ref FrontendDistribution
